# Lorehouse on Fly.io: one always-on machine with a volume for its SQLite files.
# Change `app` to your own app name. Secrets and install-specific settings are not in
# this file; set them with `fly secrets set`:
#   SLACK_SIGNING_SECRET, SLACK_BOT_TOKEN, ANTHROPIC_API_KEY, AGENT_CHANNELS
# (and optionally STATUS_TOKEN to read /status, AGENT_NAME, DM_MODE,
# SANDBOX_URL/SANDBOX_TOKEN/GITHUB_TOKEN).

app = "lorehouse"
primary_region = "nrt"

# The published image (docs/nix.md#hosts). :main is what this repository's app runs: CI
# deploys each merge's own :sha-<commit>, and a hand-run `fly deploy` gets the same
# code, not an older release. For your own install, :latest (the newest release) is the
# steadier choice. To build from source instead, set dockerfile = "Dockerfile".
[build]
  image = "ghcr.io/solcreek/lorehouse:main"

# One machine, never stopped: it holds the SQLite file, runs the live ingest and has
# to answer Slack within 3 s, so it can't wait for a cold start. A deploy restarts it
# in place; Slack redelivers what it missed and the start-up reconcile catches up.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[mounts]]
  source = "lorehouse_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
