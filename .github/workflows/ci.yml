name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # The behavioral contract — against the source, then against the compiled binary
      # (which proves prompts/ and migrations/ are embedded, not read from the checkout).
      - run: bun run conformance
      - run: bun run build
      - run: bun run conformance --app ./dist/lorehouse

  sandbox-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sandbox/guest/go.mod
      - run: go vet ./...
        working-directory: sandbox/guest
      - run: CGO_ENABLED=0 go build ./...
        working-directory: sandbox/guest

  # A merge to main that passes the contract goes live; pull requests never deploy.
  # Only this repository deploys (a fork has no FLY_API_TOKEN). flyctl waits for the
  # new machine's /healthz before it reports success.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'solcreek/lorehouse'
    needs: [check, sandbox-guest]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
