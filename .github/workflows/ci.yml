name: ci

# Every action is pinned to a full commit SHA, with its version in a comment: a moved
# tag or a compromised branch upstream can't change what runs here.
on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job says otherwise; only the image job writes (packages).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # The behavioral contract — against the source, then against the compiled binary
      # (which proves prompts/ and migrations/ are embedded, not read from the checkout).
      - run: bun run conformance
      - run: bun run build
      - run: bun run conformance --app ./dist/lorehouse

  sandbox-guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: sandbox/guest/go.mod
      - run: go vet ./...
        working-directory: sandbox/guest
      - run: go test ./...
        working-directory: sandbox/guest
      - run: CGO_ENABLED=0 go build ./...
        working-directory: sandbox/guest

  sandbox-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox/host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  # The same contract through the Nix build (flake.nix): the binary, the conformance
  # suite against it, the sandbox binaries and the container image, then the image
  # itself has to come up and answer /healthz. On both Linux architectures: each has its
  # own pinned node_modules hash in nix/packages.nix.
  nix:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix flake check -L
      - run: nix build .#image
      - name: the image answers /healthz
        run: |
          docker load < result
          docker run -d --name lorehouse -p 3000:3000 lorehouse:latest
          for _ in $(seq 30); do curl -fsS localhost:3000/healthz && exit 0; sleep 1; done
          docker logs lorehouse; exit 1
      # Fly's SSH server (fly ssh console, and so `lorehouse doctor` there) needs a root
      # user and a shell, and `lorehouse` on PATH.
      - name: the image has what fly ssh needs
        run: docker run --rm lorehouse:latest sh -c 'grep -q "^root:" /etc/passwd && command -v lorehouse'

  # The landing page. Built only: it isn't deployed yet.
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  # A merge to main that passes the contract publishes the image every container host
  # runs (Render, Railway, …): ghcr.io/solcreek/lorehouse:main and :sha-<commit>.
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'solcreek/lorehouse'
    needs: [check, nix, sandbox-guest, sandbox-host]
    permissions:
      contents: read
      packages: write # push ghcr.io/<repo> tags
    uses: ./.github/workflows/image.yml
    with:
      tags: main sha-${{ github.sha }}

  # A merge to main that passes the contract goes live, as the image just published for
  # it; pull requests never deploy. Only this repository deploys (a fork has no
  # FLY_API_TOKEN). flyctl waits for the new machine's /healthz before it reports success.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'solcreek/lorehouse'
    needs: [image]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    # This job holds FLY_API_TOKEN. Like every action in this repository's workflows,
    # its actions are pinned to a full commit SHA: a moved tag or a compromised branch
    # can't run here. Update deliberately.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # A run that finishes after a newer merge must not roll production back to it: deploy
      # only while this commit is still main's head, as image.yml does for :main. If that
      # newer merge then fails, production stays where it is until the next one passes.
      - name: deploy, unless main has moved on
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now; not deploying $GITHUB_SHA"
            exit 0
          fi
          flyctl deploy --image "ghcr.io/$GITHUB_REPOSITORY:sha-$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
