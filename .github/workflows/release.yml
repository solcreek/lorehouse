name: release

# A tag vX.Y.Z publishes the binaries install.sh downloads:
#   lorehouse-linux-x64, lorehouse-linux-arm64, SHA256SUMS, install.sh
# install.sh reads them from releases/latest/download, so the newest release is what a
# fresh server gets. The container image goes to ghcr.io/solcreek/lorehouse as :vX.Y.Z
# and :latest.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # This job can write releases, so every action in it is pinned to a full commit SHA,
    # as in ci.yml's deploy job.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # Only the publish step writes, with GH_TOKEN; install and build never see the token.
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      # A tag push doesn't run ci.yml, so its gates run here before anything is published.
      - run: bun run typecheck
      - run: bun run test
      - name: build
        run: |
          mkdir -p dist/release
          for t in linux-x64 linux-arm64; do
            bun build --compile --minify --target=bun-$t ./src/server.ts --outfile dist/release/lorehouse-$t
          done
      # The contract, against the binary that ships (x64 runs here; arm64 is the same
      # source cross-compiled).
      - run: bun run conformance --app ./dist/release/lorehouse-linux-x64
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh dist/release/
          cd dist/release
          sha256sum lorehouse-linux-x64 lorehouse-linux-arm64 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            lorehouse-linux-x64 lorehouse-linux-arm64 SHA256SUMS install.sh

  # After the gates above pass, and only from this repository.
  image:
    if: github.repository == 'solcreek/lorehouse'
    needs: release
    # One release's image at a time; image.yml moves :latest only for the newest release.
    concurrency:
      group: image-release
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tags: ${{ github.ref_name }} latest
