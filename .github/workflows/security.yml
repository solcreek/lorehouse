name: security

# Static analysis whose findings land in the Security tab (code scanning), plus the
# advisory check Dependabot doesn't do for bun. Weekly too, so a new advisory or query
# surfaces without a push. Actions are pinned to full commit SHAs, as in ci.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# A pull request from a fork or from Dependabot gets a read-only token, so it can't upload
# SARIF to code scanning. Those runs still analyze; they report in the job instead.
env:
  CAN_UPLOAD: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # sandbox/host. Rust supports only `none`: rust-analyzer reads the Cargo
          # workspace with the runner's rustup toolchain.
          - language: rust
            build-mode: none
          # sandbox/guest. Go has no `none` mode; it is traced while it builds.
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sandbox/guest/go.mod
          cache: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: CGO_ENABLED=0 go build ./...
        working-directory: sandbox/guest
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ env.CAN_UPLOAD == 'true' && 'always' || 'never' }}

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # Without an upload the action fails on any finding it prints, so it reports
          # only what would block: the Low ones are triaged in #62.
          advanced-security: ${{ env.CAN_UPLOAD }}
          annotations: ${{ env.CAN_UPLOAD == 'true' && 'false' || 'true' }}
          min-severity: ${{ env.CAN_UPLOAD == 'true' && '' || 'medium' }}

  # The only JS vulnerability check: the dependency graph doesn't read bun.lock (its SBOM
  # has just the direct package.json ranges), so Dependabot alerts never fire for JS.
  # bun's own advisory check covers every resolved package in both lockfiles and fails
  # on any advisory.
  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun audit
      - run: bun audit
        working-directory: website
