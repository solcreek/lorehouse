# Install as /etc/modules-load.d/lorehouse-sandboxd.conf, then
# `systemctl restart systemd-modules-load` (or reboot). sandboxd's unit has
# ProtectKernelModules=yes, so it can't load a module itself; these are what its taps and
# nftables rules use. The kernel may still load some on demand, but nothing relies on it.
tun
nf_tables
nf_conntrack
nf_nat
nft_ct
nft_chain_nat
nft_masq
