[package]
name = "sandboxd"
version = "0.1.0"
edition = "2021"
description = "Lorehouse sandbox host daemon: one Firecracker microVM per sandbox id, behind a small HTTP API"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "fs", "time", "sync", "signal", "io-util"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
# runner mode: connect out to Lorehouse (WebSocket or long poll), TLS via rustls
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.23"
# statvfs, for the mirrors' free-space floor; killpg, to stop a cut-off git command with
# all of its helpers
libc = "0.2"

[profile.release]
strip = true
