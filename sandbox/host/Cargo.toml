[package]
name = "sandboxd"
version = "0.1.0"
edition = "2021"
description = "Lorehouse sandbox host daemon: one Firecracker microVM per sandbox id, behind a small HTTP API"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "fs", "time", "sync", "signal", "io-util"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"

[profile.release]
strip = true
