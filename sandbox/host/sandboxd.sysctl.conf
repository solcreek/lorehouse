# Install as /etc/sysctl.d/90-lorehouse-sandboxd.conf, then `sysctl --system`.
# Sandboxes reach the internet through the host, which must forward IPv4. sandboxd can't
# set this itself: its unit (ProtectKernelTunables=yes) makes /proc/sys read-only to it.
# It checks the value at start and refuses to run while forwarding is off.
net.ipv4.ip_forward = 1
