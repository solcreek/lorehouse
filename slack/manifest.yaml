# Slack app manifest for Lorehouse. Create the app from this file (api.slack.com/apps →
# Create New App → From an app manifest), install it, then follow docs/live-slack.md.
#
# Event Subscriptions and Interactivity are left out on purpose: Slack verifies their
# Request URL with a signed challenge the moment you save, and the app can only answer
# once it has this app's signing secret. You add them after the app is running, both
# pointing at https://<your app>/slack/events (Interactivity carries the pull request
# Approve/Deny clicks).
#
# Rename `scout` to the name you set in AGENT_NAME; the two must match.
display_information:
  name: scout
  description: The company brain. Answers from what's in your public channels, and cites where.
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: scout
    always_online: true
  # Lets people DM the agent (DM_MODE redirect or answer). With DM_MODE=ignore, set
  # messages_tab_enabled to false and drop im:history.
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read  # being @-mentioned
      - channels:history   # reading public channel history (backfill, threads) and message.channels events
      - chat:write         # replying in the thread (streamed)
      - im:history         # message.im events: DMs to the agent (never indexed)
      - reactions:read     # reaction_added/removed events: 👍/👎 on the agent's replies (usage, GET /api/v1/usage)
      - users:read         # naming people in knowledge ("Wendy: …" instead of a user id)
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
